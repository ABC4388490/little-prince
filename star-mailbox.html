<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e5">
  <title>星光信箱 · The Little Prince</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="star-mailbox.css?v=2">
  <link rel="stylesheet" href="storybook.css?v=1">
  <script src="star-mailbox.js?v=2" defer></script>
</head>
<body class="starry-mailbox">
  <div class="sky" aria-hidden="true">
    <svg class="sky__orbit" viewBox="0 0 1400 1050" preserveAspectRatio="xMidYMin slice"><path d="M-80 330C170 100 450 250 810 100S550-30 690 145M780 720C800 550 1100 360 1490 370"/><path class="sky__flow" d="M780 720C800 550 1100 360 1490 370"/></svg>
    <span class="sky__star" style="--x:7%;--y:160px;--delay:0s">✦</span><span class="sky__star" style="--x:38%;--y:100px;--delay:2s">✧</span><span class="sky__star" style="--x:65%;--y:145px;--delay:4s">✦</span><span class="sky__star" style="--x:94%;--y:76px;--delay:1s">✧</span><span class="sky__star" style="--x:80%;--y:490px;--delay:3s">✦</span><span class="sky__star" style="--x:10%;--y:585px;--delay:5s">✧</span><span class="sky__star" style="--x:72%;--y:690px;--delay:2s">✦</span>
  </div>
  <nav class="page-nav" aria-label="页面导航"><a href="index.html">← 回到星球之旅</a><a href="#compose">写一封信 <span aria-hidden="true">↗</span></a></nav>
  <main class="post-office">
    <header class="page-heading">
      <span class="heading-star" aria-hidden="true">✧</span>
      <h1>星光信箱</h1>
      <p>每一封来信，都是宇宙里的一颗星星。</p>
    </header>
    <div class="mail-nav">
      <div class="mail-tabs" role="tablist" aria-label="信件分类">
        <button class="mail-tab" id="all-tab" type="button" role="tab" aria-selected="true" aria-controls="letters-panel" tabindex="0" data-filter="all">全部来信 <span id="all-count">00</span></button>
        <button class="mail-tab" id="favorite-tab" type="button" role="tab" aria-selected="false" aria-controls="letters-panel" tabindex="-1" data-filter="favorite">珍藏星光 <span id="favorite-count">00</span></button>
        <span class="tab-underline" aria-hidden="true"></span>
      </div>
    </div>
    <p class="notice" id="storage-notice" role="status" hidden></p>
    <div class="mail-layout">
      <section class="mail-content" aria-label="信件与写信区">
        <div class="collection-tools"><span id="collection-label">来自那些值得记住的日子</span><label class="search"><span aria-hidden="true">⌕</span><input id="letter-search" type="search" placeholder="找一句曾说过的话" aria-label="搜索信件内容或日期"></label></div>
        <div id="letters-panel" role="tabpanel" aria-labelledby="all-tab" tabindex="0"><div class="letter-list" id="letter-list"></div><p class="sr-only" id="results-status" role="status" aria-live="polite"></p></div>
        <section class="composer" id="compose" aria-labelledby="compose-title">
          <div class="composer__heading"><div><span class="eyebrow">TO B612 · 一封新的信</span><h2 id="compose-title">今天，想对小王子说些什么？</h2></div><span class="composer__star" aria-hidden="true">✧</span></div>
          <form id="letter-form" novalidate>
            <label class="sr-only" for="letter-body">写给小王子的信</label>
            <textarea id="letter-body" name="letter" maxlength="4000" rows="5" placeholder="亲爱的小王子：&#10;&#10;有一些话，想慢慢说给你听……" aria-describedby="compose-privacy compose-status"></textarea>
            <div class="composer__bottom"><span id="letter-length" aria-hidden="true">0 / 4000</span><button class="send-button" id="send-letter" type="submit"><span>寄往 B612</span><span aria-hidden="true">✧</span></button></div>
            <p class="compose-status" id="compose-status" role="status" aria-live="polite"></p>
            <button class="save-receipt" id="save-receipt" type="button" hidden>回信已到，重试保存到信箱</button>
          </form>
          <p class="privacy" id="compose-privacy">寄出后由 AI 小王子回信。来信和回信保存在当前浏览器，清除浏览器数据后可能无法找回。</p>
          <div class="sending-letter" aria-hidden="true">✉ <span>✦</span></div>
        </section>
      </section>
      <aside class="illustration" aria-label="B612 水彩插画">
        <div class="illustration__sticky"><img class="illustration__scene" src="assets/mailbox/b612-post-office.webp" alt="小王子和狐狸坐在星球上，守着玻璃罩里的玫瑰" width="1024" height="1024" fetchpriority="high"><p>有些话，<br>只有星星知道。</p><span class="illustration__star" aria-hidden="true">✧</span></div>
      </aside>
    </div>
    <footer class="original-footer"><p>真正重要的东西眼睛是看不见的——《小王子》</p></footer>
  </main>
  <template id="letter-template">
    <article class="letter">
      <button class="envelope" type="button">
        <span class="envelope__shadow" aria-hidden="true"></span><span class="envelope__back" aria-hidden="true"></span><span class="envelope__flap" aria-hidden="true"></span>
        <span class="letter-paper">
          <span class="postmark" aria-hidden="true">〰〰<br>〰〰<br>〰〰</span>
          <span class="postage" aria-hidden="true"><span class="postage__star">✦</span><span class="postage__planet"></span><span class="postage__name">B612</span></span>
          <span class="letter-paper__recipient">致 · 那天的自己</span><span class="letter-paper__summary"></span>
          <span class="paper-speckle" aria-hidden="true">✦</span>
        </span>
        <span class="envelope__front" aria-hidden="true"></span><span class="envelope__fold" aria-hidden="true"></span>
        <span class="botanical" aria-hidden="true"></span>
        <span class="wax-seal" aria-hidden="true"><span>✦</span></span><span class="envelope__star" aria-hidden="true">✧</span>
        <span class="open-hint">轻轻拆开这封信</span>
      </button>
      <div class="letter__meta"><time></time><button class="favorite-star" type="button"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m14 2.8 3.2 7.2 7.9.8-5.9 5.3 1.7 7.8-6.9-4-6.9 4 1.7-7.8-5.9-5.3 7.9-.8Z"/></svg><span class="favorite-spark" aria-hidden="true">✧</span></button></div>
    </article>
  </template>
  <dialog class="reader" id="letter-reader" aria-labelledby="reader-title">
    <div class="reader-sheet"><header class="reader-header"><span class="reader-postmark">B612 · STAR MAIL<br><time id="reader-date"></time></span><button class="reader-close" type="button" aria-label="收起信件">×</button></header><p class="reader-recipient">致 · 那天的自己</p><h2 id="reader-title"></h2><div class="reader-messages" id="reader-messages"></div><div class="reader-actions"><button class="reader-favorite" id="reader-favorite" type="button" aria-pressed="false"><span aria-hidden="true">☆</span> 珍藏星光</button><button class="reader-remove" id="reader-remove" type="button">移出信箱</button></div></div>
  </dialog>
  <div class="undo-toast" id="undo-toast" role="status" hidden><span>这一天的信件已移出信箱</span><button id="undo-remove" type="button">撤销</button></div>
</body>
</html>
