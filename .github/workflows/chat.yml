name: Chat regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/chat.test.cjs tests/chat-input.test.cjs tests/chat-routing.test.cjs
